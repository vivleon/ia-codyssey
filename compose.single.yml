name: ia-codyssey-compose-single

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.compose
    image: ia-codyssey-compose-web:1.0
    environment:
      APP_MODE: ${APP_MODE:-single}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "127.0.0.1:${COMPOSE_HOST_PORT:-8090}:${SERVER_PORT:-8080}"
    restart: unless-stopped
